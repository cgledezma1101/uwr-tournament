version: '3.8'

services:
  test-database:
    container_name: test-database
    image: postgres:14.10
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: uwr-tournaments-test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d uwr-tournaments-test"]
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 5s
    tmpfs:
      - /var/lib/postgresql/data
